<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SINTER</title>
    <style>
      :root {
        --ink: #e8e0d0;
        --dim: #9a9285;
        --panel: rgba(22, 20, 18, 0.9);
        --edge: rgba(232, 224, 208, 0.16);
        --warm: #e0a35c;
        --hot: #ff8244;
        --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      html, body { margin: 0; padding: 0; height: 100%; background: #0b0d10; overflow: hidden; }

      /*
       * The scene renders into a buffer about 240 lines tall and the browser
       * blows it up to fill the window. `pixelated` is what keeps the upscale
       * hard-edged; without it the browser smooths it and the whole look dies.
       */
      canvas {
        display: block;
        width: 100vw !important;
        height: 100vh !important;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      .muted { color: var(--dim); }

      body {
        font-family: var(--mono);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }

      /* ------------------------------------------------------------- hud */
      #hud {
        position: fixed; top: 14px; left: 16px;
        font-size: 11px; line-height: 1.65;
        color: var(--dim); pointer-events: none; white-space: pre;
        background: var(--panel); border: 1px solid var(--edge); border-radius: 3px;
        padding: 10px 14px; backdrop-filter: blur(6px);
      }
      #hud b { color: var(--ink); font-weight: 600; }

      #objective {
        position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
        background: var(--panel); border: 1px solid var(--edge); border-radius: 3px;
        padding: 9px 16px; font-size: 12px; letter-spacing: 0.02em;
        pointer-events: none; text-align: center; max-width: 60vw;
        backdrop-filter: blur(6px);
      }
      #objective .goal { color: var(--warm); }
      #objective .sub { color: var(--dim); font-size: 10.5px; margin-top: 3px; }

      /* ---------------------------------------------------------- prompt */
      #prompt {
        position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%);
        background: var(--panel); border: 1px solid var(--edge); border-radius: 3px;
        padding: 8px 14px; font-size: 12px; display: none; align-items: center; gap: 10px;
        pointer-events: none; backdrop-filter: blur(6px);
      }
      #prompt.on { display: flex; }
      .key {
        display: inline-block; min-width: 17px; text-align: center;
        border: 1px solid var(--edge); border-bottom-width: 2px; border-radius: 3px;
        padding: 1px 5px; font-size: 10.5px; color: var(--ink); background: rgba(255,255,255,0.07);
      }

      /* --------------------------------------------------------- controls */
      #controls {
        position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
        font-size: 10.5px; color: var(--dim); display: flex; gap: 14px;
        pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      }

      /* --------------------------------------------------------- inventory */
      #inventory {
        position: fixed; top: 0; right: 0; height: 100%; width: 390px;
        background: var(--panel); border-left: 1px solid var(--edge);
        transform: translateX(100%); transition: transform 160ms ease-out;
        display: flex; flex-direction: column; backdrop-filter: blur(10px);
      }
      #inventory.open { transform: translateX(0); }

      .inv-head {
        padding: 14px 16px 10px; border-bottom: 1px solid var(--edge);
      }
      .inv-title { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; }
      .inv-count { color: var(--dim); font-size: 10.5px; margin-top: 2px; }

      #filters {
        display: flex; flex-wrap: wrap; gap: 4px; padding: 10px 16px;
        border-bottom: 1px solid var(--edge); max-height: 108px; overflow-y: auto;
      }
      .chip {
        font-size: 9.5px; letter-spacing: 0.04em; padding: 2px 6px; border-radius: 2px;
        border: 1px solid transparent; cursor: pointer; user-select: none;
        background: rgba(255,255,255,0.06); color: var(--dim);
      }
      .chip:hover { color: var(--ink); }
      .chip.active { color: #14110e; font-weight: 700; }

      #items { flex: 1; overflow-y: auto; padding: 8px; }
      .card {
        display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: center;
        padding: 7px 9px; border: 1px solid transparent; border-radius: 3px; cursor: pointer;
      }
      .card:hover { background: rgba(255,255,255,0.05); border-color: var(--edge); }
      .card.picked { background: rgba(224,163,92,0.14); border-color: var(--warm); }
      .swatch { width: 30px; height: 30px; border-radius: 2px; border: 1px solid var(--edge); }
      .card-name { font-size: 11.5px; }
      .card-props { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 3px; }
      .pchip { font-size: 8.5px; padding: 1px 4px; border-radius: 2px; color: #14110e; font-weight: 700; }
      .empty { color: var(--dim); font-size: 11px; text-align: center; padding: 28px 12px; line-height: 1.6; }

      /* ------------------------------------------------------------ bench */
      #bench { border-top: 1px solid var(--edge); padding: 12px 16px 14px; }
      .bench-title { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); margin-bottom: 9px; }
      .slots { display: grid; grid-template-columns: 1fr 16px 1fr; gap: 8px; align-items: center; }
      .slot {
        height: 54px; border: 1px dashed var(--edge); border-radius: 3px;
        display: flex; align-items: center; justify-content: center; text-align: center;
        font-size: 10px; color: var(--dim); padding: 4px; cursor: pointer; line-height: 1.35;
      }
      .slot.filled { border-style: solid; color: var(--ink); background: rgba(255,255,255,0.05); }
      .plus { text-align: center; color: var(--dim); font-size: 13px; }

      #result {
        margin-top: 10px; padding: 9px 10px; border-radius: 3px;
        border: 1px solid var(--edge); background: rgba(255,255,255,0.04);
        font-size: 11px; min-height: 34px; display: flex; align-items: center; gap: 9px;
      }
      #result .q { font-size: 19px; color: var(--warm); }

      #merge-btn {
        margin-top: 10px; width: 100%; padding: 9px; cursor: pointer;
        background: var(--warm); color: #171310; border: none; border-radius: 3px;
        font-family: var(--mono); font-size: 11px; font-weight: 700;
        letter-spacing: 0.13em; text-transform: uppercase;
      }
      #merge-btn:disabled { background: rgba(255,255,255,0.09); color: var(--dim); cursor: default; }
      .warn { font-size: 9.5px; color: var(--dim); margin-top: 7px; text-align: center; line-height: 1.5; }

      /* ------------------------------------------------------------ toast */
      #toasts {
        position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%);
        display: flex; flex-direction: column-reverse; gap: 6px; align-items: center;
        pointer-events: none;
      }
      .toast {
        background: var(--panel); border: 1px solid var(--edge); border-left: 2px solid var(--warm);
        border-radius: 3px; padding: 8px 14px; font-size: 11.5px; backdrop-filter: blur(6px);
        animation: rise 300ms ease-out;
      }
      .toast .label { color: var(--dim); font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; }
      .toast.fire { border-left-color: var(--hot); }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

      #flash {
        position: fixed; inset: 0; pointer-events: none; opacity: 0;
        background: radial-gradient(circle at 50% 60%, rgba(255,120,50,0.3), transparent 62%);
        transition: opacity 500ms ease-out;
      }
    </style>
  </head>
  <body>
    <div id="hud"></div>

    <div id="objective">
      <div class="goal">Get past the palisade.</div>
      <div class="sub">Nobody wrote down how. Work it out.</div>
    </div>

    <div id="prompt"></div>

    <div id="controls">
      <span><span class="key">WASD</span> move</span>
      <span><span class="key">Q</span><span class="key">E</span> rotate</span>
      <span><span class="key">F</span> take</span>
      <span><span class="key">G</span> drop</span>
      <span><span class="key">TAB</span> pack</span>
    </div>

    <div id="toasts"></div>
    <div id="flash"></div>

    <aside id="inventory">
      <div class="inv-head">
        <div class="inv-title">Pack</div>
        <div class="inv-count" id="inv-count">nothing yet</div>
      </div>
      <div id="filters"></div>
      <div id="items"></div>
      <div id="bench">
        <div class="bench-title">Merge Bench</div>
        <div class="slots">
          <div class="slot" id="slot-a">empty</div>
          <div class="plus">+</div>
          <div class="slot" id="slot-b">empty</div>
        </div>
        <div id="result"><span style="color:var(--dim)">pick two things</span></div>
        <button id="merge-btn" disabled>Merge</button>
        <div class="warn">Both inputs are destroyed. There is no undo.</div>
      </div>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
